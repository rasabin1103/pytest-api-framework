on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL base del entorno a testear'
        required: true
        type: string
      health_endpoint:
        description: 'Endpoint de salud a comprobar'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          BASE_URL: ${{ inputs.base_url }}
          HEALTH_ENDPOINT: ${{ inputs.health_endpoint }}
          TIMEOUT: "10"
          LOG_HTTP: "false"
          LOG_LEVEL: "INFO"
        run: pytest -v --html=report.html --self-contained-html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.html
